<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سُنَّة | للعطور الفاخرة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif, Arial;
        }
        body {
            background-color: #0b0b0b;
            color: #f3f3f3;
            line-height: 1.6;
        }
        header {
            background: #111;
            border-bottom: 1px solid #d4af37;
            padding: 20px 0;
            text-align: center;
        }
        .logo h1 {
            color: #d4af37;
            font-size: 28px;
            letter-spacing: 2px;
        }
        .logo p {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }
        .hero {
            padding: 60px 20px;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1615397349754-cfa2066a298e?auto=format&fit=crop&w=1200&q=80') center/cover;
        }
        .hero h2 {
            color: #d4af37;
            font-size: 36px;
            margin-bottom: 15px;
        }
        .hero p {
            color: #ccc;
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        .btn-whatsapp {
            display: inline-block;
            background-color: #d4af37;
            color: #0b0b0b;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s;
        }
        .btn-whatsapp:hover {
            background-color: #f3c653;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .section-title {
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 20px;
            border-bottom: 2px solid #222;
            display: inline-block;
            padding-bottom: 5px;
        }
        footer {
            background: #111;
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
            border-top: 1px solid #222;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>سُنَّة</h1>
            <p>للعطور الفاخرة</p>
        </div>
    </header>

    <section class="hero">
        <h2>عطور تجمع بين ثبات العطور العالمية</h2>
        <p>رحلة عطرية فاخرة صُممت خصيصاً لتناسب ذوقك الرفيع وتدوم طويلاً.</p>
        <a href="https://wa.me/" class="btn-whatsapp" target="_blank">اطلب عبر واتساب</a>
    </section>

    <div class="container">
        <h3 class="section-title">قريباً عرض المجموعات والعطور</h3>
        <p style="color: #888; margin-top: 20px;">جارٍ إضافة تفاصيل العطور والأسعار بكل عناية لتليق برقي براند سُنَّة.</p>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 سُنَّة (Sunnah Perfumes)</p>
    </footer>

</body>
</html>
